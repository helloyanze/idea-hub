<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea Hub</title>
<link rel="stylesheet" href="/static/style.css?v=20260814">
</head>
<body>

<!-- ===================== 顶栏 ===================== -->
<header class="header">
  <div class="brand">
    <span class="logo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
    </span>
    Idea Hub
  </div>

  <div class="topbar-status">
    <span id="schedStatus" title="调度器状态">调度: --</span>
    <span id="tokenToday" title="今日 token 消耗">今日: --</span>
    <button class="notif-btn" id="notifBtn" title="通知中心">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>通知
      <span id="notifBadge" class="badge hidden">0</span>
    </button>
  </div>

  <div class="group view">
    <select class="select" id="goalSelect" title="目标切换"></select>
    <button class="btn mini-add" id="addTargetBtn" title="新建目标模式">+ 目标</button>
    <select class="select" id="tagFilter" title="标签过滤"><option value="">全部标签</option></select>
  </div>

  <div class="group manage">
    <button class="btn" id="openSource">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>来源管理
    </button>
    <button class="btn" id="openTag">
      <svg viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.4a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>标签管理
    </button>
  </div>

  <div class="group action">
    <button class="btn primary" id="collectBtn">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>立即收集
    </button>
    <button class="btn" id="generateBtn" title="查看待生成候选并提示生成流程">
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l2.8 2.8m8.4 8.4L19 19M19 5l-2.8 2.8M7.8 16.2 5 19"/></svg>立即生成
    </button>
    <div class="switch on" id="autoSwitch" title="每晚自动运行">
      <span>自动运行</span>
      <span class="track"></span>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="搜索标题 / 标签 / 摘要" />
    <kbd>/</kbd>
  </div>

  <div class="stats" id="stats">
    <div class="stat todo" data-col="todo"><span class="dot"></span><span class="stat-label">待办</span> <b>0</b></div>
    <div class="stat waiting" data-col="waiting"><span class="dot"></span><span class="stat-label">等待</span> <b>0</b></div>
    <div class="stat in_progress" data-col="in_progress"><span class="dot"></span><span class="stat-label">进行中</span> <b>0</b></div>
    <div class="stat done" data-col="done"><span class="dot"></span><span class="stat-label">已完成</span> <b>0</b></div>
    <div class="stat archived" data-col="archived" title="点开查看留档（低分仓库 / 完成存档）"><span class="dot"></span><span class="stat-label">留档</span> <b>0</b> <span class="stat-arrow" style="font-size:11px;color:var(--text-3)">↗</span></div>
  </div>

  <button class="btn icon more" id="btn-more" title="更多">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
  </button>
  <button class="btn icon" id="openSettings" title="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="btn icon" id="themeBtn" title="深色 / 浅色">
    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<!-- 窄屏更多菜单 -->
<div class="more-menu" id="moreMenu" hidden>
  <button class="btn" id="more-source"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>来源管理</button>
  <button class="btn" id="more-tag"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.4a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>标签管理</button>
  <button class="btn" id="more-collect"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>立即收集</button>
  <button class="btn" id="more-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>设置</button>
</div>

<!-- ===================== 看板（四列，JS 渲染） ===================== -->
<main class="board" id="board"></main>

<!-- ===================== 抽屉 ===================== -->
<div class="scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head">
    <textarea class="editable-title" id="drTitle" rows="2"></textarea>
    <button class="dr-close" id="drClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot">
    <button class="btn" id="drSave">保存修改</button>
    <button class="btn primary" id="drRun">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l14 9-14 9V3z"/></svg>执行
    </button>
    <button class="btn danger" id="drDel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>删除
    </button>
  </div>
</aside>

<!-- ===================== 通知中心抽屉 ===================== -->
<div class="scrim" id="notifScrim"></div>
<aside class="drawer notif-drawer" id="notifDrawer" aria-hidden="true">
  <div class="notif-head">
    <h3>通知中心</h3>
    <button class="btn mini" id="notifReadAll">全部已读</button>
    <button class="dr-close" id="notifClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="dr-body" id="notifList"></div>
</aside>

<!-- ===================== 设置弹窗 ===================== -->
<div class="modal" id="settingsModal">
  <div class="scrim2" data-close></div>
  <div class="box">
    <div class="m-head"><h3>设置</h3><button class="dr-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="m-body" id="settingsBody"></div>
    <div class="m-foot">
      <button class="btn" data-close>关闭</button>
      <button class="btn primary" id="settingsSave">保存设置</button>
    </div>
  </div>
</div>

<!-- ===================== 来源管理弹窗 ===================== -->
<div class="modal" id="sourceModal">
  <div class="scrim2" data-close></div>
  <div class="box">
    <div class="m-head"><h3>来源管理</h3><button class="dr-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="m-body" id="sourceList"></div>
    <div class="m-foot">
      <button class="btn" data-close>关闭</button>
      <button class="btn primary" id="addSource">+ 添加来源</button>
    </div>
  </div>
</div>

<!-- ===================== 标签管理弹窗 ===================== -->
<div class="modal" id="tagModal">
  <div class="scrim2" data-close></div>
  <div class="box">
    <div class="m-head"><h3>标签管理</h3><button class="dr-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="m-body" id="tagList"></div>
    <div class="m-foot">
      <button class="btn" data-close>关闭</button>
      <button class="btn primary" id="addTag">+ 添加标签</button>
    </div>
  </div>
</div>

<!-- ===================== 目标模式弹窗 ===================== -->
<div class="modal" id="targetModal">
  <div class="scrim2" data-close></div>
  <div class="box" style="width:460px">
    <div class="m-head"><h3>新建目标模式</h3><button class="dr-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="m-body">
      <label class="t-label">名称</label>
      <input id="tg-name" class="full" placeholder="如：自媒体内容">
      <label class="t-label">描述（指导 AI 生成 idea）</label>
      <input id="tg-desc" class="full" placeholder="如：面向普通读者的深度文章">
      <label class="t-label">评分维度（JSON，可选）</label>
      <input id="tg-dims" class="full" placeholder='如 {"热度":8,"相关性":7,"可执行性":6,"预期价值":7}，留空用默认'>
    </div>
    <div class="m-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="tg-save">创建并激活</button>
    </div>
  </div>
</div>

<!-- ===================== 留档弹窗（低分 / 未采用 / 完成存档） ===================== -->
<div class="modal" id="archivedModal">
  <div class="scrim2" data-close></div>
  <div class="box" style="width:680px">
    <div class="m-head">
      <h3>留档 · 低分 / 完成存档</h3>
      <button class="dr-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="m-body arch-grid" id="archivedList"></div>
    <div class="m-foot">
      <span style="margin-right:auto;color:var(--text-3);font-size:12px" id="archivedHint"></span>
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- ===================== 批量操作条 ===================== -->
<div class="batchbar" id="batchBar">
  <span id="batchCount">已选 0 项</span>
  <button class="btn danger" id="batchDel">批量删除</button>
  <button class="btn" id="batchArchive">批量归档</button>
  <button class="btn" id="batchTodo">批量退回待办</button>
  <button class="btn" id="batchClear">取消</button>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/app.js?v=20260814b"></script>
</body>
</html>
